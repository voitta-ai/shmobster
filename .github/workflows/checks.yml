name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # --require-hashes, so the lock is the lock (#152). Without it pip will
      # happily install a resolution the lock does not describe, and the file
      # becomes a suggestion. It also fails loudly if requirements.txt was
      # hand-edited instead of regenerated from requirements.in.
      - name: Install
        run: pip install --require-hashes -r requirements.txt

      # Known-vulnerability gate. The dependency that mattered here arrived
      # transitively -- aiohttp, through litellm and slack-sdk -- so nothing in
      # this repo chose its version and nothing would have noticed it aging
      # (#152). This is what notices.
      - name: pip-audit
        run: |
          pip install pip-audit
          # --strict so a package pip-audit cannot resolve fails the build
          # instead of being skipped. Without it the gate is quietly narrower
          # than it looks: the audit passes having audited less than everything.
          pip-audit --strict

      # The repo's whole test surface. Offline by design: no Slack, no network,
      # no real keys -- it stubs the env refs the example config makes.
      - name: selfcheck
        run: python selfcheck.py

      # The file every new operator copies. A trailing comma here breaks setup
      # for someone who has no reason to suspect the example.
      - name: Example configs parse
        run: |
          for f in examples/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

      # Structural half of the pre-publish gate, ported from skillz: token and
      # key shapes, account ids, private IPs, internal domains. A public repo
      # that ships example configs and pasted terminal output is exactly where
      # a real value slips in. The name-wordlist half stays off CI on purpose
      # (see the script header).
      - name: Sensitive-term gate (structural)
        run: |
          bash scripts/check-sensitive-terms.sh \
            shmobster/ examples/ deploy/ docs/ workspace/ README.md selfcheck.py
