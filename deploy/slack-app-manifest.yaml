# Create the Shmobster Slack app from this manifest:
#   api.slack.com/apps -> Create New App -> From an app manifest
#   -> pick the Method and apparatus workspace -> paste this.
# Then:
#   - Install to workspace, copy the Bot User OAuth Token (xoxb-)
#       -> shmobster-config.json  slack.bot_token
#   - Basic Information -> App-Level Tokens -> Generate, scope connections:write
#       -> copy (xapp-) -> shmobster-config.json  slack.app_token
#   - Invite the bot into the target channel: /invite @Shmobster
#
# These bot scopes are the complete set the loop calls (README, "Slack scopes").
# An app that predates this file may hold many more; read what it actually has
# from the X-OAuth-Scopes header (README, "What a live app actually holds") and
# trim it down to this list rather than adding to it.
display_information:
  name: Shmobster
  description: Standalone multi-vendor Slack agent (bottom-up).
features:
  bot_user:
    display_name: Shmobster
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - reactions:write
      - files:read
settings:
  socket_mode_enabled: true
  # Approve/Deny buttons on parked commands (#50). Over Socket Mode this needs
  # no request URL and no extra OAuth scope -- interactions arrive on the same
  # websocket. An app created before this line must enable Interactivity in the
  # app settings and reinstall, or the buttons go nowhere.
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  token_rotation_enabled: false
